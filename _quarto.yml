project:
  type: book
  output-dir: docs
  post-render:
    - touch docs/.nojekyll

metadata-files:
  - _book.yml

execute:
  freeze: auto
  echo: true
  warning: false
  message: false
  cache: true

bibliography:
  - references.bib
  - packages.bib
csl: chicago-author-date.csl
link-citations: true

crossref:
  lof-title: "List of Figures"
  lot-title: "List of Tables"

format:
  html:
    theme:
      - cosmo
      - custom.scss
    toc: true
    toc-depth: 3
    toc-location: right
    number-sections: false
    smooth-scroll: true
    code-fold: true
    code-tools: true
    df-print: kable
    fig-cap-location: bottom
    tbl-cap-location: top
    citations-hover: true
    crossrefs-hover: true
